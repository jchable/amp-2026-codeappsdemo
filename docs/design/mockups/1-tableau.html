<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette 1 : Le tableau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --fond:#E6ECF0; --puits:#D6DFE6; --encre:#17222D; --doux:#4A5A68; --carte:#fff; --bord:#BCC9D3;
  --lagon:#0E7C86; --lagon-clair:#CDEBED; --haute:#B3261E; --moy:#C58A10; --basse:#7C8C99; --danger:#9B1C14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:400 15px/1.45 "Instrument Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lagon);outline-offset:2px}
.page{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
header.haut{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{font:800 clamp(30px,4vw,44px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0}
.principal{background:var(--lagon);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer}
.principal:hover{background:#0A6870}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.onglets button{background:transparent;border:1.5px solid var(--bord);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.onglets button[aria-pressed=true]{background:var(--encre);border-color:var(--encre);color:#fff}
.onglets b{font-weight:600;margin-left:6px;opacity:.75}
.tableau{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.tableau.seule{grid-template-columns:1fr}
.tableau.seule .cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.voie{background:var(--puits);border-radius:16px;padding:14px}
.voie h2{font:800 22px/1.1 "Bricolage Grotesque",sans-serif;margin:2px 4px 2px;display:flex;justify-content:space-between;align-items:baseline}
.voie h2 span{font:500 14px "Instrument Sans";color:var(--doux)}
.voie p.aide{margin:0 4px 12px;color:var(--doux);font-size:13.5px}
.cartes{display:flex;flex-direction:column;gap:10px}
.carte{--barre:var(--basse);--epais:2px;background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:12px 14px 12px 22px;position:relative;box-shadow:inset var(--epais) 0 0 0 var(--barre)}
.carte.p-haute{--barre:var(--haute);--epais:9px}
.carte.p-moyenne{--barre:var(--moy);--epais:5px}
.carte h3{margin:0 0 4px;font:600 16px/1.3 "Instrument Sans"}
.carte .qui{color:var(--doux);font-size:13.5px}
.carte .desc{margin:8px 0 0;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prio{font-size:12.5px;font-weight:600;margin-top:8px}
.prio.haute{color:var(--haute)} .prio.moyenne{color:#8A5D00} .prio.basse{color:var(--doux)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.actions button{border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.actions .avance{background:var(--lagon);border:1px solid var(--lagon);color:#fff}
.actions .autre{background:#fff;border:1.5px solid var(--bord)}
.actions .suppr{margin-left:auto;background:none;border:0;color:var(--danger);font-weight:500;text-decoration:underline;padding:8px 4px}
.vide{color:var(--doux);padding:14px 6px;font-size:14px}
.arrive{animation:arrive .9s ease-out}
@keyframes arrive{from{background:var(--lagon-clair);transform:translateY(-4px)}to{background:var(--carte);transform:none}}
.composeur{background:#fff;border:2px solid var(--lagon);border-radius:12px;padding:14px;margin-bottom:10px}
.composeur h3{margin:0 0 10px;font:800 18px "Bricolage Grotesque"}
.composeur label{display:block;font-size:13.5px;font-weight:600;margin-bottom:10px}
.composeur input,.composeur select,.composeur textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--bord);border-radius:8px;padding:9px 10px;background:#fff;font-weight:400}
.erreurs{color:var(--danger);font-size:13.5px;margin:0 0 10px;padding-left:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--encre);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500}
@media (max-width:900px){.tableau{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.arrive{animation:none}}
</style>
</head>
<body>
<div class="page">
  <header class="haut">
    <h1>Demandes aMP</h1>
    <button class="principal" id="ouvrir" type="button">Nouvelle demande</button>
  </header>
  <div class="onglets" id="onglets" role="group" aria-label="Filtrer par statut"></div>
  <main class="tableau" id="tableau"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="store.js"></script>
<script>
let filtre="Tous", composer=false, derniere=null;
const AIDES={"Nouveau":"À trier et à prendre en charge","En cours":"Quelqu'un s'en occupe","Résolu":"Terminé, rouvrable"};
const $=(s)=>document.querySelector(s);
function carte(t){
  const p=t.priorite.toLowerCase();
  const boutons=Store.transitions(t.statut).map((v,i)=>`<button type="button" class="${i===0?'avance':'autre'}" data-id="${t.id}" data-vers="${v}">${Store.verbe(t.statut,v)}</button>`).join("");
  return `<article class="carte p-${p} ${derniere===t.id?'arrive':''}">
    <h3>${Store.esc(t.titre)}</h3>
    <div class="qui">Demandé par ${Store.esc(t.demandeur)}, ${Store.quand(t.creeLe)}</div>
    ${t.description?`<p class="desc">${Store.esc(t.description)}</p>`:""}
    <div class="prio ${p}">Priorité ${p}</div>
    <div class="actions">${boutons}<button type="button" class="suppr" data-suppr="${t.id}">Supprimer</button></div>
  </article>`;
}
function formulaire(){
  return `<form class="composeur" id="form" novalidate><h3>Nouvelle demande</h3>
    <label>Titre<input name="titre" placeholder="Ex. Vidéoprojecteur en panne" autofocus></label>
    <label>Demandeur<input name="demandeur" placeholder="Prénom Nom"></label>
    <label>Description<textarea name="description" rows="2" placeholder="Facultatif"></textarea></label>
    <label>Priorité<select name="priorite"><option>Basse</option><option selected>Moyenne</option><option>Haute</option></select></label>
    <div class="erreurs-zone"></div>
    <div class="actions"><button class="avance" type="submit">Créer</button><button class="autre" type="button" id="annuler">Annuler</button></div></form>`;
}
function rendre(){
  const c=Store.compter();
  $("#onglets").innerHTML=["Tous",...Store.STATUTS].map(s=>`<button type="button" data-f="${s}" aria-pressed="${s===filtre}">${s}<b>${c[s]}</b></button>`).join("");
  const statuts=filtre==="Tous"?Store.STATUTS:[filtre];
  $("#tableau").className="tableau"+(filtre==="Tous"?"":" seule");
  $("#tableau").innerHTML=statuts.map(s=>{
    const l=Store.liste(s);
    const form=(composer&&s==="Nouveau")?formulaire():"";
    return `<section class="voie" aria-label="${s}"><h2>${s}<span>${l.length}</span></h2><p class="aide">${AIDES[s]}</p>
      ${form}<div class="cartes">${l.length?l.map(carte).join(""):`<p class="vide">Aucune demande ${s==="Résolu"?"résolue":"ici"} pour le moment.</p>`}</div></section>`;
  }).join("");
  derniere=null;
}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.f){filtre=b.dataset.f;rendre()}
  else if(b.id==="ouvrir"){composer=true;if(filtre!=="Tous"&&filtre!=="Nouveau")filtre="Tous";rendre()}
  else if(b.id==="annuler"){composer=false;rendre()}
  else if(b.dataset.vers){derniere=b.dataset.id;Store.changerStatut(b.dataset.id,b.dataset.vers);toast(`Demande passée à ${b.dataset.vers}.`)}
  else if(b.dataset.suppr){Store.supprimer(b.dataset.suppr);toast("Demande supprimée.")}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  const r=Store.creer(d);
  if(!r.ok){e.target.querySelector(".erreurs-zone").innerHTML=`<ul class="erreurs">${r.erreurs.map(x=>`<li>${x}</li>`).join("")}</ul>`;return}
  composer=false;derniere=r.ticket.id;toast("Demande créée.");
});
Store.onChange(rendre);rendre();
</script>
</body>
</html>
