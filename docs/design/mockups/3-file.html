<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette 3 : La file</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --fond:#FBFCFD; --encre:#0F141A; --doux:#55606B; --ligne:#DDE2E8; --surlignage:#FFE14D;
  --nouveau:#2457D6; --encours:#9A5A00; --resolu:#157347; --danger:#B42318;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:400 15px/1.5 "Schibsted Grotesk",system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
.barre{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--ligne)}
.barre h1{margin:0;font:800 20px "Schibsted Grotesk";letter-spacing:-.01em;margin-right:auto}
.seg{display:inline-flex;border:1.5px solid var(--encre);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:7px 12px;font-weight:600;cursor:pointer;border-right:1.5px solid var(--encre)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--encre);color:#fff}
.seg i{font-style:normal;font-weight:500;margin-left:6px;opacity:.7}
.nouveau-btn{background:var(--surlignage);border:1.5px solid var(--encre);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.zones{flex:1;display:grid;grid-template-columns:minmax(320px,2fr) minmax(0,3fr);min-height:0}
.liste{border-right:1px solid var(--ligne);overflow:auto;margin:0;padding:0;list-style:none}
.ligne{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 20px;border-bottom:1px solid var(--ligne);cursor:pointer;position:relative;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.ligne[aria-current=true]{background:var(--surlignage);box-shadow:inset 5px 0 0 var(--encre)}
.ligne .titre{font-weight:600;line-height:1.35}
.ligne .meta{color:var(--doux);font-size:13.5px;margin-top:2px}
.ligne[aria-current=true] .meta{color:#2B2B0A}
.st{font-weight:600}.st.nouveau{color:var(--nouveau)}.st.encours{color:var(--encours)}.st.resolu{color:var(--resolu)}
.barres{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:3px}
.barres span{width:5px;background:#C6CDD5;border-radius:1px}
.barres span:nth-child(1){height:7px}.barres span:nth-child(2){height:13px}.barres span:nth-child(3){height:20px}
.barres.p1 span:nth-child(-n+1),.barres.p2 span:nth-child(-n+2),.barres.p3 span:nth-child(-n+3){background:var(--encre)}
.detail{overflow:auto;padding:28px clamp(20px,4vw,48px)}
.detail h2{margin:0 0 8px;font:800 clamp(24px,3vw,34px)/1.15 "Schibsted Grotesk";letter-spacing:-.015em;max-width:24ch}
.faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0;padding:14px 0;border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne)}
.faits dt{font-size:13px;color:var(--doux)}.faits dd{margin:2px 0 0;font-weight:600}
.detail p.desc{max-width:62ch;margin:0 0 22px;font-size:16px}
.parcours{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.parcours button{padding:10px 16px;border-radius:8px;border:1.5px solid var(--encre);background:#fff;font-weight:700;cursor:pointer}
.parcours .actuel{background:var(--encre);color:#fff;cursor:default}
.parcours button:disabled{border-style:dashed;border-color:#9AA5B1;color:#7B8692;cursor:not-allowed}
.regle{font-size:13.5px;color:var(--doux);margin:0 0 26px;min-height:20px}
.suppr{background:none;border:0;color:var(--danger);font-weight:600;text-decoration:underline;cursor:pointer;padding:6px 0}
.formulaire{max-width:520px}
.formulaire label{display:block;font-weight:600;margin-bottom:14px}
.formulaire input,.formulaire textarea,.formulaire select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid #9AA5B1;border-radius:8px;background:#fff;font-weight:400}
.err{color:var(--danger);margin:0 0 12px}
.vide{padding:40px;color:var(--doux)}
.aide-clavier{font-size:13px;color:var(--doux);padding:10px 24px;border-top:1px solid var(--ligne)}
kbd{border:1px solid #9AA5B1;border-bottom-width:2px;border-radius:5px;padding:0 6px;font:600 12px "Schibsted Grotesk"}
@media (max-width:820px){.zones{grid-template-columns:1fr}.liste{border-right:0;border-bottom:1px solid var(--ligne);max-height:45vh}body{height:auto}}
</style>
</head>
<body>
<header class="barre">
  <h1>Demandes aMP</h1>
  <div class="seg" id="seg" role="group" aria-label="Filtrer par statut"></div>
  <button class="nouveau-btn" id="nouveau" type="button">Nouvelle demande</button>
</header>
<div class="zones">
  <ul class="liste" id="liste" aria-label="Demandes"></ul>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>
<div class="aide-clavier"><kbd>↑</kbd> <kbd>↓</kbd> pour parcourir les demandes</div>
<script src="store.js"></script>
<script>
let filtre="Tous", sel=null, mode="detail";
const $=(s)=>document.querySelector(s);
const cls=(s)=>s==="En cours"?"encours":s==="Résolu"?"resolu":"nouveau";
const niveau={Basse:1,Moyenne:2,Haute:3};
function rendre(){
  const c=Store.compter(), l=Store.liste(filtre);
  if(!l.find(t=>t.id===sel))sel=l[0]?l[0].id:null;
  $("#seg").innerHTML=["Tous",...Store.STATUTS].map(s=>`<button type="button" data-f="${s}" aria-pressed="${s===filtre}">${s}<i>${c[s]}</i></button>`).join("");
  $("#liste").innerHTML=l.length?l.map(t=>`<li><button class="ligne" data-id="${t.id}" aria-current="${t.id===sel&&mode==='detail'}">
    <span class="barres p${niveau[t.priorite]}" title="Priorité ${t.priorite.toLowerCase()}"><span></span><span></span><span></span></span>
    <span><span class="titre">${Store.esc(t.titre)}</span><span class="meta" style="display:block">${Store.esc(t.demandeur)}, ${Store.quand(t.creeLe)}, <span class="st ${cls(t.statut)}">${t.statut}</span></span></span></button></li>`).join(""):`<li class="vide">Aucune demande dans ce statut.</li>`;
  $("#detail").innerHTML=mode==="nouveau"?formulaire():detail(Store.trouver(sel));
}
function detail(t){
  if(!t)return `<p class="vide">Sélectionnez une demande, ou créez-en une.</p>`;
  const parcours=Store.STATUTS.map(s=>{
    if(s===t.statut)return `<button class="actuel" type="button" aria-current="step">${s}</button>`;
    const ok=Store.transitions(t.statut).includes(s);
    return `<button type="button" ${ok?`data-id="${t.id}" data-vers="${s}"`:"disabled"} data-cible="${s}">${ok?Store.verbe(t.statut,s):s}</button>`;
  }).join("");
  return `<h2>${Store.esc(t.titre)}</h2>
  <dl class="faits"><div><dt>Demandeur</dt><dd>${Store.esc(t.demandeur)}</dd></div><div><dt>Créée</dt><dd>${Store.quand(t.creeLe)}</dd></div>
  <div><dt>Priorité</dt><dd>${t.priorite}</dd></div><div><dt>Statut</dt><dd><span class="st ${cls(t.statut)}">${t.statut}</span></dd></div></dl>
  <p class="desc">${t.description?Store.esc(t.description):"Pas de description."}</p>
  <div class="parcours" role="group" aria-label="Changer le statut">${parcours}</div>
  <p class="regle" id="regle">${t.statut==="Nouveau"?"Depuis Nouveau, on passe d'abord par En cours.":""}</p>
  <button class="suppr" type="button" data-suppr="${t.id}">Supprimer la demande</button>`;
}
function formulaire(){
  return `<form class="formulaire" id="form" novalidate><h2>Nouvelle demande</h2>
  <label>Titre<input name="titre" placeholder="Ex. Vidéoprojecteur en panne" autofocus></label>
  <label>Demandeur<input name="demandeur" placeholder="Prénom Nom"></label>
  <label>Description<textarea name="description" rows="3" placeholder="Facultatif"></textarea></label>
  <label>Priorité<select name="priorite"><option>Basse</option><option selected>Moyenne</option><option>Haute</option></select></label>
  <div id="err"></div>
  <div class="parcours"><button class="actuel" type="submit" style="cursor:pointer">Créer</button><button type="button" id="annuler">Annuler</button></div></form>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.f){filtre=b.dataset.f;mode="detail";rendre()}
  else if(b.classList.contains("ligne")){sel=b.dataset.id;mode="detail";rendre()}
  else if(b.id==="nouveau"){mode="nouveau";rendre()}
  else if(b.id==="annuler"){mode="detail";rendre()}
  else if(b.dataset.vers){Store.changerStatut(b.dataset.id,b.dataset.vers)}
  else if(b.dataset.suppr){Store.supprimer(b.dataset.suppr)}
});
document.addEventListener("mouseover",e=>{const b=e.target.closest(".parcours button:disabled");const r=$("#regle");if(r&&b)r.textContent=`De ${Store.trouver(sel).statut} vers ${b.dataset.cible}, ce n'est pas possible : passez d'abord par En cours.`});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const r=Store.creer(Object.fromEntries(new FormData(e.target)));
  if(!r.ok){$("#err").innerHTML=r.erreurs.map(x=>`<p class="err">${x}</p>`).join("");return}
  sel=r.ticket.id;mode="detail";filtre="Tous";rendre();
});
document.addEventListener("keydown",e=>{
  if(!["ArrowDown","ArrowUp"].includes(e.key)||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const l=Store.liste(filtre);const i=l.findIndex(t=>t.id===sel);
  const n=l[Math.max(0,Math.min(l.length-1,i+(e.key==="ArrowDown"?1:-1)))];
  if(n){e.preventDefault();sel=n.id;mode="detail";rendre();const el=document.querySelector(`.ligne[data-id="${n.id}"]`);if(el)el.focus()}
});
Store.onChange(rendre);rendre();
</script>
</body>
</html>
